---
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: exmeralda_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    environment:
      DB_HOST: db
      DB_NAME: exmeralda_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      MIX_ENV: dev
      HOST: "0.0.0.0"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: >
      /bin/sh -c "
        echo 'Installing dependencies...' &&
        mix deps.get &&
        mix deps.compile &&
        echo '' &&
        echo 'Compiling application...' &&
        mix compile &&
        echo '' &&
        echo 'Setting up database...' &&
        mix ecto.create &&
        mix ecto.migrate &&
        mix seed &&
        echo '' &&
        echo 'Setting up assets...' &&
        cd assets && npm install && cd .. &&
        echo '' &&
        echo "" &&
        echo '==========================================' &&
        echo 'Exmeralda app is starting...' &&
        echo 'Open http://localhost:4000' &&
        echo '=========================================='
        iex -S mix phx.server
      "

  # OLLAMA_HOST=http://ollama:11434 docker compose --profile llm up
  ollama:
    profiles: ["llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  model-pull:
    profiles: ["llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=========================================="
        echo "Pulling Ollama models..."
        echo "=========================================="

        echo ""
        echo "[1/2] Pulling llama3.2..."
        ollama pull llama3.2:latest

        echo ""
        echo "[2/2] Pulling jina-embeddings..."
        ollama pull unclemusclez/jina-embeddings-v2-base-code

        echo ""
        echo "=========================================="
        echo "All models ready!"
        echo "=========================================="

volumes:
  pgdata:
  ollama_models:
